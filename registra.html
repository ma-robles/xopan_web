        <div id="div_header">
            <img class='logo' src='img/logo_icaycc.png' alt='Logo ICAyCC' >
            <img class='logo' src='img/logo_pembu2.png' alt='Logo PEMBU' >
        </div>
        <nav class="menu">

        <div id='div_main' >

                <div> 
                    <H1> XOPAN </H1> 
                    <p class='subtitle'> Aquí puedes registrar tus datos  </p> 
                        <form id='form_upload' class='' action="https://ruoa.unam.mx:8040/xopan_api" method="post">
                            <div id="div_upload">
                                <label> Fecha: <input id='datetime' name='datetime' type='datetime-local' required >
                                </label>
                                <label > ID: <input name='uid' required type='text' size=8 required >
                                </label>
                                <label> precipitación: <input name='rain' required type='number' step='0.01' value='0.0'>
                                </label>
                                <input class='boton' type="button" id ="btn_send" value='enviar' >
                              </div>
                        </form>
                </div>

            </aside>
